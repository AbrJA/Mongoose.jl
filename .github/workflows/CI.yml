name: CI
on:
  pull_request:
  push:
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: actions/cache@v6
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - name: Dev package into the test env
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Acceptance suite (wire-level)
        run: julia --project=test test/acceptance/production.jl
        timeout-minutes: 20
      - name: Quality gates (Aqua + JET baseline)
        run: julia --project=test test/quality/quality.jl
        timeout-minutes: 30
      - name: Performance smoke (advisory)
        run: julia --project=. bench/dispatch.jl
        continue-on-error: true
  aot:
    name: AOT trim-safe smoke (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Install JuliaC
        run: julia -e 'using Pkg; Pkg.Apps.add(name="JuliaC")'
      - name: Build the trim-safe smoke app
        run: |
          cat > /tmp/trim_app.jl <<'JULIA'
          using Mongoose
          router = @routes begin
              get("/hello", req -> json((message = "hello", n = 42)))
              group("/api"; middleware = (cors(origins = "*"),)) do api
                  get("/users/:id::Int", (req, id) -> text("user $id"))
              end
          end
          app = App(router = router)
          app = use(app, cors())
          app = use(app, etag())
          function main(args)
              client = FakeTransport(app)
              r = client(:get, "/hello")
              (r.status == 200 && occursin("hello", String(r.body))) || return 1
              client(:get, "/api/users/7").body == "user 7" || return 2
              client(:get, "/missing").status == 404 || return 3
              return 0
          end
          @main
          JULIA
          ~/.julia/bin/juliac --output-exe trim_app --trim=safe --experimental \
            --project="$PWD" /tmp/trim_app.jl > /tmp/trim_app.log 2>&1
          test ! grep -q "^Verifier error" /tmp/trim_app.log
      - name: Run the trimmed binary (self-checking)
        run: ./trim_app
  docs:
      name: Documentation
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v7
        - uses: julia-actions/setup-julia@v3
          with:
            version: '1'
        - name: Install dependencies
          run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
        - name: Build and deploy documentation
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          run: julia --project=docs/ docs/make.jl
      needs: [test] # The docs job will wait until core checks pass.
